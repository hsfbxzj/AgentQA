[project]
name = "agentqa"
version = "0.2.0"
description = "OpenAPI-driven API testing and regression analysis agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = [
    "backend/tests/agentqa",
    "backend/tests/agentqa_demo",
]
